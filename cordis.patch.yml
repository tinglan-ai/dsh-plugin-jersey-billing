# API 中转站计费统计插件 bundle patch。
#
# 一个 insert 层：Host 半边负责跨会话用量聚合与单价持久化，
# 浏览器半边（dsh.client 扫描 lib/client.js）负责侧边栏面板 UI。
#
# 这两行都按 id 寻址，你可以在 profile 的 cordis.patch.yml 里
# 覆盖它们的 config 或 disabled。

- insert:
    - id: llm-billing
      name: 'dsh-plugin-jersey-billing'
      config:
        # 唯一计入统计的 provider id（日志里 request/header 的 provider 值）。
        # 换统计对象只改这一行，不用改代码：
        #   泽西   → zexitongxue
        #   Znb    → znb-gongsi
        #   itkk   → itkk
        provider: 'itkk'
        # 价格单位：每百万 token 的人民币价格（CNY / 1M tokens）。
        # 面板里改价格会写进 DSH_HOME/billing-prices.json，这里只作为首次运行的默认值。
        currency: '¥'
        # 首次运行的默认价目表（面板内可增删改，改完以面板为准）。
        #
        # itkk 的 deepseek-v4.1-flash-1017：
        #   输入      0.1    / 百万 token
        #   输出      0.4    / 百万 token
        #   缓存读取  0.002  / 百万 token
        #   缓存写入  不收费 → 0
        models:
          - id: 'deepseek-v4.1-flash-1017'
            label: 'DeepSeek V4.1 Flash 1017'
            inputPerMillion: 0.1
            outputPerMillion: 0.4
            cacheReadPerMillion: 0.002
            cacheWritePerMillion: 0
